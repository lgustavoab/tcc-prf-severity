[project]
name = "tcc-prf-severity"
version = "0.1.0"
description = "TCC de Ciência de Dados: gravidade de acidentes em rodovias federais brasileiras (PRF, 2021-2025)."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "matplotlib",
    "polars",
    "pandera[polars]",
    "scikit-learn>=1.9.0",
    "xgboost==3.3.0",
]

[project.scripts]
prf-audit = "tcc_prf_severity.cli:audit_main"
prf-audit-temporal-drift = "tcc_prf_severity.cli:audit_temporal_drift_main"
prf-build-analytical = "tcc_prf_severity.cli:build_analytical_main"
prf-build-interim = "tcc_prf_severity.cli:build_interim_main"
prf-design-experiment = "tcc_prf_severity.cli:design_experiment_main"
prf-eda-general = "tcc_prf_severity.cli:eda_general_main"
prf-eda-geographic = "tcc_prf_severity.cli:eda_geographic_main"
prf-eda-occurrence-dynamics = "tcc_prf_severity.cli:eda_occurrence_dynamics_main"
prf-eda-road-environment = "tcc_prf_severity.cli:eda_road_environment_main"
prf-eda-severity-associations = "tcc_prf_severity.cli:eda_severity_associations_main"
prf-eda-temporal = "tcc_prf_severity.cli:eda_temporal_main"
prf-verify-interim = "tcc_prf_severity.cli:verify_interim_main"
prf-verify-analytical = "tcc_prf_severity.cli:verify_analytical_main"
prf-validate-preprocessing = "tcc_prf_severity.cli:validate_preprocessing_main"
prf-run-logistic-baseline = "tcc_prf_severity.cli:run_logistic_baseline_main"
prf-run-random-forest-baseline = "tcc_prf_severity.cli:run_random_forest_baseline_main"
prf-run-xgboost-baseline = "tcc_prf_severity.cli:run_xgboost_baseline_main"
prf-compare-models = "tcc_prf_severity.cli:compare_models_main"

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "ruff",
]
ml = [
    "mlflow",
    "optuna",
    "shap",
]
viz = [
    "jupyterlab",
    "plotly",
    "streamlit",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:the default behavior of `how='horizontal'` for `concat` is deprecated:DeprecationWarning:pandera.backends.polars.checks",
]
