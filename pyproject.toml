[project]
name = "tcc-prf-severity"
version = "0.1.0"
description = "TCC de Ciência de Dados: gravidade de acidentes em rodovias federais brasileiras (PRF, 2021-2025)."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "polars",
    "pandera[polars]",
]

[project.scripts]
prf-audit = "tcc_prf_severity.cli:audit_main"
prf-ingest = "tcc_prf_severity.cli:ingest_main"

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "ruff",
]
ml = [
    "mlflow",
    "optuna",
    "scikit-learn",
    "shap",
    "xgboost",
]
viz = [
    "jupyterlab",
    "matplotlib",
    "plotly",
    "streamlit",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:the default behavior of `how='horizontal'` for `concat` is deprecated:DeprecationWarning:pandera.backends.polars.checks",
]
